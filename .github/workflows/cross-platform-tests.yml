name: Cross Platform Tests
on:
  # Run daily at midnight
  schedule:
    - cron: "0 0 * * *"

  # Allow workflow to be manually run from the GitHub UI
  workflow_dispatch:

  # Allow workflow to be called from other files
  workflow_call:

  push:
  pull_request:

jobs:
  pr-branch-check-name:
    name: "Check PR for semantic branch name"
    if: ${{ github.event.pull_request }}
    uses: mParticle/mparticle-workflows/.github/workflows/pr-branch-check-name.yml@main
  pr-title-check:
    name: "Check PR for semantic title"
    if: ${{ github.event.pull_request }}
    uses: mParticle/mparticle-workflows/.github/workflows/pr-title-check.yml@main
  pr-branch-target-gitflow:
    name: "Check PR for semantic target branch"
    if: ${{ github.event.pull_request }}
    uses: mParticle/mparticle-workflows/.github/workflows/pr-branch-target-continuous.yml@main
  pr-checks:
    name:  "PR Checks"
    if: always() && !failure()
    runs-on: ubuntu-latest
    needs: [pr-branch-target-gitflow, pr-title-check, pr-branch-check-name]
    steps:
      - name: "Confirm PR Checks"
        run: echo "PR Checks Pass"
  android-tests:
    name: "Android Tests"
    if: always() && !failure()
    needs: pr-checks
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: "Install JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 300
          script: ./gradlew runAndroid
      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: Tests/build/reports/androidTests/connected/**
  ios-tests:
    name: "IOS Test"
    if: always() && !failure()
    runs-on: macos-14
    needs: pr-checks
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: "Install JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - name: Install Cocoapods
        run: sudo gem install cocoapods; sudo gem install cocoapods-generate
      - name: Choose Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Use classic linker (Kotlin 1.9.0 incompatible with Xcode 15 ld_prime)
        run: |
          TOOLCHAIN_BIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          echo "Toolchain bin: ${TOOLCHAIN_BIN}"
          ls -la "${TOOLCHAIN_BIN}/ld"* || echo "No ld* files found"
          if [ -f "${TOOLCHAIN_BIN}/ld_classic" ]; then
            echo "ld_classic found, installing as ld"
            sudo mv "${TOOLCHAIN_BIN}/ld" "${TOOLCHAIN_BIN}/ld_prime"
            sudo ln -sf "${TOOLCHAIN_BIN}/ld_classic" "${TOOLCHAIN_BIN}/ld"
            echo "Symlink created: $(ls -la ${TOOLCHAIN_BIN}/ld)"
          else
            echo "WARNING: ld_classic not found in ${TOOLCHAIN_BIN}, skipping linker swap"
            ls "${TOOLCHAIN_BIN}" | grep ld || echo "No ld variants found"
          fi
      - name: Clean CocoaPods synthetic build cache
        run: |
          find . -type d -name "XCBuildData" -path "*/cocoapods/synthetic/*" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "build" -path "*/cocoapods/synthetic/ios/*" -exec rm -rf {} + 2>/dev/null || true
      - name: Run iOS cross platform tests
        run: ./gradlew runIos
      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: /Users/runner/Library/Developer/Xcode/DerivedData